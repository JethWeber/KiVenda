name: KiVenda - Infrastructure Tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    paths:
      - "src/KiVenda.Infrastructure/**"
      - "src/KiVenda.Application/**"
      - "src/KiVenda.Core/**"
      - "tests/KiVenda.Infrastructure.Tests/**"
      - "*.props"
      - "*.json"
      - "*.sln"

jobs:
  infrastructure-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/KiVenda.Infrastructure.Tests/KiVenda.Infrastructure.Tests.csproj

      - name: Build
        run: dotnet build tests/KiVenda.Infrastructure.Tests/KiVenda.Infrastructure.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/KiVenda.Infrastructure.Tests/KiVenda.Infrastructure.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
